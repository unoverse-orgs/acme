# THE SHAPE OF A CREDENTIAL, NEVER ITS VALUE.
#
# This file declares what an OpenAI credential LOOKS LIKE: which fields it has, which
# are secret, what to show in the form that collects it. It never holds a key. Values
# live where they already live: encrypted in the database on a deployed universe, and
# in your own .env when running locally.
#
# Locally the runner reads .env as <CREDENTIAL>_<FIELD> in upper snake case, so
# openAICredential.apiKey is the .env line:
#
#   OPENAI_API_KEY=sk-...
#
# Nodes reference this shape BY NAME. At run time every credential in the workflow is
# available keyed by name, and a call selects the one it means:
#
#   credential:
#     scheme: bearer
#     token: "{{ credentials.openAICredential.apiKey }}"
#
# Full guide: https://docs.unoverse.ai/nodes/credentials

name: openAICredential
displayName: OpenAI
description: Credentials for the OpenAI API
documentationUrl: https://platform.openai.com/api-keys

properties:
  - name: apiKey
    displayName: API Key
    type: string
    required: true
    # `secret: true` is what keeps the value write-only: it is stored encrypted and
    # never echoed back into any form or log.
    secret: true
    description: Your OpenAI API key
    placeholder: sk-...
