# The org's organisation: its own words, and only those. The briefs, the limits and the shape are the
# organisation object's (design/marketplace/objects/organisation/); this file carries the answers as defaults.
unoverse: "1.0"
type: identity
extends: organisation
props:
  name:
    default: ""
  what:
    default: ""
  units:
    default: []
  vocabulary:
    default: ""
