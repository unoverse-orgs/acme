# The org's brand: its own words, and only those. The briefs, the limits and the shape are the
# brand object's (design/marketplace/objects/brand/); this file carries the answers as defaults.
unoverse: "1.0"
type: identity
extends: brand
props:
  name:
    default: ""
  pronunciation:
    default: ""
  standsFor:
    default: ""
  promise:
    default: ""
  represents:
    default: ""
  positioning:
    default: ""
  differentiators:
    default: []
  brands:
    default: []
  rules:
    default: []
  examples:
    default: []
