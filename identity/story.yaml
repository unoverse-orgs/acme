# The org's story: its own words, and only those. The briefs, the limits and the shape are the
# story object's (design/marketplace/objects/story/); this file carries the answers as defaults.
unoverse: "1.0"
type: identity
extends: story
props:
  history:
    default: ""
  milestones:
    default: []
  present:
    default: ""
  vision:
    default: ""
  people:
    default: ""
  meaning:
    default: ""
