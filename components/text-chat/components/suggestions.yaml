type: Box
visibleWhen: hasMessages
style:
  width: full
  position: relative
  direction: column
  background: transparent
children:
  - type: Box
    visibleWhen:
      field: openPanel
      eq: faq
    style:
      width: full
      direction: column
      gap: "2"
      background: surface.base
      radius: lg
      padding: "4"
      shadow: lg
      margin: [ "0", "0", "2", "0" ]
      animation:
        name: slideUp
        duration: 0.3s
        easing: ease-out
        iteration: "1"
    children:
      - type: Box
        style:
          direction: row
          justify: end
        children:
          - type: Button
            action:
              type: setAppValue
              values:
                - key: openPanel
                  value: null
            style:
              flex: 0 0 auto
              cursor: pointer
              width: "8"
              height: "8"
              radius: full
              background: surface.base
              border: subtle
              shadow: sm
              direction: row
              align: center
              justify: center
              transition: all 150ms ease
              hover:
                background: surface.sunken
            children:
              - type: Icon
                icon: close
                style:
                  width: "4"
                  height: "4"
                  color: text.secondary
      - type: Each
        style:
          direction: row
          wrap: wrap
          align: start
          gap: "2"
          width: full
        item:
          type: Button
          action:
            type: sendMessage
            then:
              type: setAppValue
              values:
                - key: openPanel
                  value: null
          style:
            direction: row
            align: center
            flex: 0 0 auto
            maxWidth: full
            padding: [ "2", "4" ]
            background: surface.base
            border: subtle
            outline: none
            radius: full
            shadow: sm
            cursor: pointer
            transition: all 150ms ease
            hover:
              background: surface.sunken
          children:
            - type: Text
              bind:
                value: text
              style:
                font: body.sm
                color: text.secondary
                lineHeight: tight
        items:
          - text: What can you help me with?
          - text: How does this work?
          - text: Show me an example
  - type: Box
    style:
      width: full
      direction: row
      justify: center
      padding: [ "1", "0" ]
    children:
      - type: Button
        action:
          type: setAppValue
          values:
            - key: openPanel
              value: faq
        style:
          direction: row
          align: center
          gap: "1"
          padding: [ "1", "3" ]
          background: surface.base
          border: subtle
          outline: none
          radius: full
          cursor: pointer
          transition: all 150ms ease
          hover:
            background: surface.sunken
        children:
          - type: Icon
            icon: chat
            style:
              width: "4"
              height: "4"
              color: text.secondary
          - type: Text
            style:
              font: body.sm
              color: text.secondary
              weight: medium
            value: Suggestions
