type: Box
style:
  direction: row
  align: center
  justify: space-between
  height: "20"
  padding: [ "0", "4" ]
  background: transparent
children:
  - type: Box
    style:
      direction: row
      align: center
      gap: "2"
    children:
      - type: Icon
        icon: sparkles
        style:
          width: "6"
          height: "6"
          color: action.primary
      - type: Text
        style:
          font: title
          color: text.primary
        value: Assistant
  - type: Button
    action: close
    style:
      flex: 0 0 auto
      cursor: pointer
      width: "8"
      height: "8"
      radius: full
      background: surface.base
      border: subtle
      shadow: sm
      direction: row
      align: center
      justify: center
      transition: all 150ms ease
      hover:
        background: surface.sunken
    children:
      - type: Icon
        icon: close
        style:
          width: "4"
          height: "4"
          color: text.secondary
    visibleWhen:
      field: surfacedView
      in: [ "" ]
