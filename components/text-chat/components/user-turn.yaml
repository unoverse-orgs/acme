type: Box
style:
  direction: row
  justify: end
children:
  - type: Box
    style:
      direction: row
      align: center
      background: action.primary
      radius: 2xl
      radiusTopRight: sm
      padding: [ "2", "4" ]
      maxWidth: compact
    children:
      - type: Text
        bind:
          value: text
        style:
          font: body.md
          color: action.primary-text
          lineHeight: tight
